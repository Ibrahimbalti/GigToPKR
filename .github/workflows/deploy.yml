name: Auto Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Hostinger VPS and Deploy
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" '
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin
            cd /var/www/GigToPKR
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env.local -e .env
            touch .env.local
            grep -q "^NEXT_PUBLIC_SITE_URL=" .env.local || echo "NEXT_PUBLIC_SITE_URL=https://realgigpay.com" >> .env.local
            if grep -q "^NEXT_PUBLIC_GA_MEASUREMENT_ID=" .env.local; then
              sed -i "s/^NEXT_PUBLIC_GA_MEASUREMENT_ID=.*/NEXT_PUBLIC_GA_MEASUREMENT_ID=G-LT24F7PE93/" .env.local
            else
              echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=G-LT24F7PE93" >> .env.local
            fi
            npm ci
            npm run build
            pm2 restart realgigpay
          '
