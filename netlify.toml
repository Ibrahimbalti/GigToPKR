# Netlify detects Next.js and applies the OpenNext adapter on its own.
# The build command stays the npm script so the home calculator is bundled
# before `next build` and the homepage HTML is trimmed after it.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://realgigpay.com"
